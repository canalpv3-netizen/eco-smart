<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco Smart Lavanderia</title>
<style>
:root{--bg:#f5f7f7;--card:#fff;--tx:#16262b;--mut:#66797d;--pri:#15803d;--pri2:#1670c2;--bd:#e2e9e8;--bad:#b3392b;--warn:#a86a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1517;--card:#141f22;--tx:#e8f0ef;--mut:#8ea3a6;--bd:#243538;--pri:#34c26a;--pri2:#5aaef0;--warn:#e0a63a;--bad:#e5766a}}
:root[data-theme="dark"]{--bg:#0d1517;--card:#141f22;--tx:#e8f0ef;--mut:#8ea3a6;--bd:#243538;--pri:#34c26a;--pri2:#5aaef0;--warn:#e0a63a;--bad:#e5766a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 16px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--pri2),var(--pri)) 1}
header div{display:flex;flex-direction:column;line-height:1.25}header strong{color:var(--pri2);font-size:16px;font-weight:650;letter-spacing:.2px}header span{font-size:12px;color:var(--mut)}
#logo{display:block;border-radius:50%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:0 8px}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:600 13.5px inherit;font-family:inherit;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--pri2);border-color:var(--pri2)}
main{max-width:540px;margin:0 auto;padding:16px 14px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.st{display:flex;align-items:center;gap:10px;margin-bottom:12px}.n{width:22px;height:22px;border-radius:50%;background:var(--pri2);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
h2{font-size:15px;font-weight:650;margin:0}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;cursor:pointer}
.svc>span:nth-child(2){flex:1;font-weight:600}.svc.on{border-color:var(--pri2);background:color-mix(in srgb,var(--pri2) 8%,var(--card))}
.svc small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none}.svc.on .ck{border-color:var(--pri2);background:var(--pri2);box-shadow:inset 0 0 0 3.5px var(--card)}
.price{font-weight:650;white-space:nowrap}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 40%,transparent);border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.step{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.step button{width:44px;height:42px;border:0;background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
.step b{min-width:48px;text-align:center;font-size:16px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--pri2),var(--pri));color:#fff;font:650 15px inherit;font-family:inherit;cursor:pointer;margin-top:14px}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.bad{background:var(--bad)}.btn.sm{padding:10px;font-size:13.5px;margin-top:0}
.ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.ln.m{color:var(--mut);font-size:13px;padding-top:0}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-top:10px;padding-top:12px;border-top:1px solid var(--bd)}
.tot span:last-child{color:var(--pri2)}
.lkg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.lk{padding:10px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit;cursor:pointer}.lk.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:650}
.pendente{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}.confirmado{background:color-mix(in srgb,var(--pri) 15%,var(--card));color:var(--pri)}.recusado{background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}
.muted{color:var(--mut);font-size:13.5px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.sub button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px inherit;font-family:inherit;cursor:pointer}
.sub button.on{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.srow{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
a.link{color:var(--pri2);font-weight:600;text-decoration:none;font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 16px 22px}

#ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--card) 97%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#ov svg{width:min(78vw,300px);height:auto;overflow:visible}
.msgs{position:relative;height:30px;width:100%;margin-top:6px}.msgs div{position:absolute;left:0;right:0;font-weight:650;font-size:17px;color:var(--pri2)}
.m1{animation:hide .25s 2.1s forwards}.m2{opacity:0;animation:show .3s 2.3s forwards,hide .25s 3.4s forwards}.m3{opacity:0;color:var(--pri)!important;animation:show .3s 3.5s forwards}
.ovb{opacity:0;width:min(86vw,320px);margin-top:18px;animation:show .4s 4s forwards}.ovb a{text-decoration:none;text-align:center}
.mach{animation:out .35s 2.2s forwards;transform-origin:120px 110px}.bagS{opacity:0;animation:inn .4s 2.3s forwards;transform-origin:120px 150px}
.spin{transform-origin:120px 110px;animation:spin 1.1s linear infinite}
.bb{animation:bub 1.1s ease-in infinite}.bb2{animation-delay:.4s}.bb3{animation-delay:.75s}
.cl{opacity:0}.cl1{animation:drop .5s 2.5s forwards}.cl2{animation:drop .5s 2.85s forwards}.cl3{animation:drop .5s 3.2s forwards}
.bump{transform-origin:120px 190px;animation:bump .4s 3.45s}
.ckk{opacity:0;transform-origin:166px 108px;animation:pop .4s 3.7s forwards}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--card);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#toast.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bub{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-46px);opacity:0}}
@keyframes out{to{opacity:0;transform:scale(.8)}}
@keyframes inn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes drop{0%{transform:translateY(-110px) rotate(-18deg);opacity:0}20%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bump{50%{transform:scale(1.07,.94)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0}}
</style>
</head>

<script>

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

var SB='https://nukinxefqppnufikjoop.supabase.co/rest/v1/rpc/',SK='sb_publishable_RF83YerRhYGh3edZ0tru6A_FdSsK8or';
function rpc(fn,a){return fetch(SB+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SK},body:JSON.stringify(a||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||'erro');return j})})}
var cfg=def,myOrders=[],proOrders=[],pw='',myLoading=false,myPhone=ld('ecosmart_phone','');
function norm(o){o.date=new Date(o.created_at).toLocaleString('pt-BR');o.locker=(o.lockers||[]).join(', ');return o}
function loadCfg(){rpc('eco_get_config').then(function(r){cfg=r;render()}).catch(function(){})}
function loadMy(){if(!myPhone)return;myLoading=true;rpc('eco_my_orders',{p_phone:myPhone}).then(function(r){myOrders=r.map(norm);myLoading=false;if(tab==='meus')render()}).catch(function(){myLoading=false})}
function loadPro(){rpc('eco_pro_orders',{p_pass:pw}).then(function(r){proOrders=r.map(norm);if(tab==='pro'&&sub==='pedidos')render()}).catch(function(){})}
function setPhone(){myPhone=document.getElementById('mp').value;sv('ecosmart_phone',myPhone);loadMy();render()}
var pT=null;function pushCfg(){clearTimeout(pT);pT=setTimeout(function(){rpc('eco_pro_save_config',{p_pass:pw,p_whats:cfg.whats,p_cycle:cfg.cycle,p_lockers:cfg.lockers,p_services:cfg.services,p_new_pass:null}).then(function(){toast()}).catch(function(){alert('Não foi possível salvar. Tente novamente.')})},300)}
function newPass(v){if(!v)return;rpc('eco_pro_save_config',{p_pass:pw,p_whats:cfg.whats,p_cycle:cfg.cycle,p_lockers:cfg.lockers,p_services:cfg.services,p_new_pass:v}).then(function(){pw=v;alert('Senha alterada.')}).catch(function(){alert('Não foi possível alterar a senha.')})}
var tab='pedido',sub='pedidos',authed=false,sel={},qty=1,lk=[],draft={name:'',phone:'',obs:''};
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(s){var n=parseFloat(String(s).replace(',','.'));return isNaN(n)||n<0?0:n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function digits(s){return String(s).replace(/\D/g,'')}
function wa(n,t){n=digits(n);if(n.length<=11)n='55'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(t)}
function total(){var t=0;cfg.services.forEach(function(s){if(sel[s.id])t+=s.price*qty+s.fee});return t}
function nav(){
 var t=[['pedido','Fazer pedido'],['meus','Meus pedidos'+(myOrders.length?' ('+myOrders.length+')':'')]];if(tab==='pro')t.push(['pro','Profissional']);
 document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
}
function go(t){tab=t;render();if(t==='meus')loadMy();if(t==='pro'&&authed&&sub==='pedidos')loadPro()}
var taps=0,tapT=null;
function logoTap(){taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0},2000);if(taps>=5){taps=0;tab='pro';render()}}
function render(){nav();var a=document.getElementById('app');a.innerHTML=tab==='pedido'?vPedido():tab==='meus'?vMeus():vPro()}
function vPedido(){
 var opts='';
 for(var i=1;i<=cfg.lockers;i++)opts+='<button class="lk'+(lk.indexOf(i)>-1?' on':'')+'" onclick="tl('+i+')">'+i+'</button>';
 var sv_=cfg.services.map(function(s){return '<button class="svc'+(sel[s.id]?' on':'')+'" onclick="tg(\''+s.id+'\')"><span class="ck"></span><span>'+esc(s.name)+'<small>Até '+cfg.cycle+' peças por ciclo</small></span><span class="price">'+brl(s.price)+'</span></button>'}).join('');
 var items=cfg.services.filter(function(s){return sel[s.id]});
 var res=items.length?items.map(function(s){return '<div class="ln"><span>'+esc(s.name)+' · '+qty+' ciclo'+(qty>1?'s':'')+'</span><span>'+brl(s.price*qty)+'</span></div><div class="ln m"><span>Taxa de serviço</span><span>'+brl(s.fee)+'</span></div>'}).join(''):'<p class="muted" style="margin:0">Selecione um serviço para ver o resumo.</p>';
 return '<div class="card"><div class="st"><span class="n">1</span><h2>Serviço</h2></div>'+sv_+'<p class="muted" style="margin:6px 0 0">É possível selecionar mais de um serviço.</p></div>'+
 '<div class="card"><div class="st"><span class="n">2</span><h2>Armário e quantidade</h2></div><label style="margin-top:0">Armários onde estão as roupas</label><div class="lkg">'+opts+'</div><p class="muted" style="margin:8px 0 0">'+(lk.length?'Selecionado(s): '+lk.slice().sort(function(a,b){return a-b}).join(', '):'Toque para selecionar um ou mais armários.')+'</p>'+
 '<label>Ciclos (1 ciclo = '+cfg.cycle+' peças)</label><div class="step"><button onclick="q(-1)">−</button><b>'+qty+'</b><button onclick="q(1)">+</button></div></div>'+
 '<div class="card"><div class="st"><span class="n">3</span><h2>Seus dados</h2></div><label style="margin-top:0">Nome</label><input value="'+esc(draft.name)+'" oninput="draft.name=this.value">'+
 '<label>WhatsApp</label><input inputmode="tel" placeholder="(11) 90000-0000" value="'+esc(draft.phone)+'" oninput="draft.phone=this.value">'+
 '<label>Observação (opcional)</label><textarea rows="2" oninput="draft.obs=this.value">'+esc(draft.obs)+'</textarea></div>'+
 '<div class="card"><div class="st"><span class="n">4</span><h2>Resumo</h2></div>'+res+'<div class="tot"><span>Total</span><span>'+brl(total())+'</span></div>'+
 '<button class="btn" onclick="send()">Enviar pedido pelo WhatsApp</button></div>';
}
function tl(i){var k=lk.indexOf(i);if(k>-1)lk.splice(k,1);else lk.push(i);render()}
function tg(id){sel[id]=!sel[id];render()}
function q(d){qty=Math.max(1,qty+d);render()}
function send(){
 var items=cfg.services.filter(function(s){return sel[s.id]});
 if(!items.length)return alert('Escolha pelo menos um serviço.');
 if(!lk.length)return alert('Escolha pelo menos um armário.');
 if(!draft.name.trim()||digits(draft.phone).length<10)return alert('Informe seu nome e WhatsApp com DDD.');
 var ls=lk.slice().sort(function(a,b){return a-b}),d={name:draft.name.trim(),phone:draft.phone,obs:draft.obs.trim()},n=qty,t0=total();
 function fin(tot){
  var txt='*Novo pedido – Eco Smart Lavanderia*\nCliente: '+d.name+'\nWhatsApp: '+d.phone+'\n'+(ls.length>1?'Armários: ':'Armário: ')+ls.join(', ')+'\nServiços: '+items.map(function(i){return i.name}).join(' + ')+'\nCiclos: '+n+' ('+cfg.cycle+' peças cada)\nTotal: '+brl(tot)+(d.obs?'\nObs.: '+d.obs:'');
  sel={};qty=1;lk=[];draft={name:d.name,phone:d.phone,obs:''};myPhone=d.phone;sv('ecosmart_phone',myPhone);
  tab='meus';render();loadMy();anim(wa(cfg.whats,txt));
 }
 rpc('eco_create_order',{p_name:d.name,p_phone:d.phone,p_lockers:ls,p_qty:n,p_obs:d.obs,p_services:items.map(function(i){return i.id})})
 .then(function(r){fin(r.total)}).catch(function(){alert('Não foi possível registrar o pedido no sistema. Vamos abrir o WhatsApp mesmo assim.');fin(t0)});
}
function tagOf(s){return '<span class="tag '+s+'">'+({pendente:'Aguardando',confirmado:'Confirmado',recusado:'Recusado'})[s]+'</span>'}
function ordHtml(o,pro){
 var b='';
 if(pro){
  if(o.status==='pendente')b='<div class="row" style="margin-top:10px"><button class="btn sm" onclick="st('+o.id+',\'confirmado\')">Confirmar</button><button class="btn sm bad" onclick="st('+o.id+',\'recusado\')">Recusar</button></div>';
  else b='<div class="row" style="margin-top:10px"><a class="link" target="_blank" href="'+wa(o.phone,o.status==='confirmado'?'Olá, '+o.name+'! Seu pedido (armário '+o.locker+') foi confirmado. Eco Smart Lavanderia.':'Olá, '+o.name+'. Infelizmente não conseguimos atender seu pedido (armário '+o.locker+'). Eco Smart Lavanderia.')+'">Avisar cliente no WhatsApp</a><button class="btn sm sec" onclick="st('+o.id+',\'pendente\')">Desfazer</button></div>';
 }
 return '<div class="card"><div class="top"><b>'+(o.lockers&&o.lockers.length>1?'Armários ':'Armário ')+esc(o.locker)+'</b>'+tagOf(o.status)+'</div><div class="muted">'+esc(o.date)+(pro?' · '+esc(o.name)+' · '+esc(o.phone):'')+'</div>'+
 '<div style="margin-top:6px">'+o.items.map(function(i){return esc(i.name)}).join(' + ')+' · '+o.qty+' ciclo(s)</div>'+(o.obs?'<div class="muted">Obs.: '+esc(o.obs)+'</div>':'')+
 '<div class="price" style="margin-top:4px">'+brl(o.total)+'</div>'+b+'</div>';
}
function vMeus(){
 var f='<div class="card"><label style="margin-top:0">Seu WhatsApp</label><div class="row"><input id="mp" inputmode="tel" placeholder="(11) 90000-0000" value="'+esc(myPhone)+'"><button class="btn sm" style="flex:none;width:auto;padding:11px 18px" onclick="setPhone()">Ver</button></div></div>';
 if(!myPhone)return f+'<div class="card muted">Informe o WhatsApp usado no pedido para ver seus pedidos e o status.</div>';
 return f+(myOrders.length?myOrders.map(function(o){return ordHtml(o,false)}).join(''):'<div class="card muted">'+(myLoading?'Carregando…':'Nenhum pedido encontrado para este número.')+'</div>');
}
function st(id,s){rpc('eco_pro_status',{p_pass:pw,p_id:id,p_status:s}).then(loadPro).catch(function(){alert('Não foi possível atualizar o pedido.')})}
function vPro(){
 if(!authed)return '<div class="card"><h2>Área do profissional</h2><label>Senha</label><input id="pw" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')login()"><button class="btn" onclick="login()">Entrar</button><button class="btn sec" onclick="go(\'pedido\')">Voltar</button></div>';
 var s=[['pedidos','Pedidos'],['servicos','Serviços e taxas'],['config','Configurações']];
 var h='<div class="sub">'+s.map(function(x){return '<button class="'+(sub===x[0]?'on':'')+'" onclick="sub=\''+x[0]+'\';render();if(sub===\'pedidos\')loadPro()">'+x[1]+'</button>'}).join('')+'</div>';
 if(sub==='pedidos'){
  var p=proOrders.filter(function(o){return o.status==='pendente'}).length;
  return h+'<div class="top" style="margin-bottom:10px"><span class="muted">'+p+' pedido(s) aguardando resposta</span><button class="btn sm sec" style="width:auto;padding:8px 14px" onclick="loadPro()">Atualizar</button></div>'+(proOrders.length?proOrders.map(function(o){return ordHtml(o,true)}).join(''):'<div class="card muted">Nenhum pedido ainda.</div>');
 }
 if(sub==='servicos'){
  return h+'<p class="muted">Edite o valor e a taxa de cada serviço. A alteração vale na hora para os próximos pedidos.</p>'+cfg.services.map(function(x,i){return '<div class="srow"><label style="margin-top:0">Nome do serviço</label><input value="'+esc(x.name)+'" onchange="us('+i+',\'name\',this.value)">'+
  '<div class="row"><div><label>Valor do serviço por ciclo (R$)</label><input inputmode="decimal" value="'+String(x.price).replace('.',',')+'" onchange="us('+i+',\'price\',this.value)"></div>'+
  '<div><label>Taxa do serviço (R$)</label><input inputmode="decimal" value="'+String(x.fee).replace('.',',')+'" onchange="us('+i+',\'fee\',this.value)"></div></div>'+
  (cfg.services.length>1?'<button class="btn sm sec" style="margin-top:10px" onclick="rs('+i+')">Remover serviço</button>':'')+'</div>'}).join('')+
  '<button class="btn sec" onclick="as()">+ Adicionar serviço</button>';
 }
 return h+'<div class="card"><label style="margin-top:0">WhatsApp que recebe os pedidos (com DDD)</label><input inputmode="tel" value="'+esc(cfg.whats)+'" onchange="cfg.whats=digits(this.value);sv(KEY_C,cfg)">'+
 '<label>Peças por ciclo</label><input inputmode="numeric" value="'+cfg.cycle+'" onchange="cfg.cycle=Math.max(1,parseInt(this.value)||25);sv(KEY_C,cfg)">'+
 '<label>Quantidade de armários</label><input inputmode="numeric" value="'+cfg.lockers+'" onchange="cfg.lockers=Math.max(1,parseInt(this.value)||30);sv(KEY_C,cfg)">'+
 '<label>Nova senha da área do profissional</label><input type="password" placeholder="Deixe em branco para manter" onchange="newPass(this.value)">'+
 '<button class="btn sec" onclick="authed=false;pw=\'\';proOrders=[];tab=\'pedido\';render()">Sair</button></div>';
}
function login(){var v=document.getElementById('pw').value;rpc('eco_pro_orders',{p_pass:v}).then(function(r){pw=v;authed=true;proOrders=r.map(norm);render()}).catch(function(){alert('Senha incorreta.')})}
function us(i,k,v){cfg.services[i][k]=(k==='name')?v.trim()||'Serviço':num(v);sv(KEY_C,cfg)}
function as(){cfg.services.push({id:'s'+Date.now(),name:'Novo serviço',price:0,fee:0});sv(KEY_C,cfg);render()}
function rs(i){cfg.services.splice(i,1);sv(KEY_C,cfg);render()}

 '<path d="M96 98C96 62 144 62 144 98" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>'+

 setTimeout(function(){try{window.open(url,'_blank')}catch(e){}},4300);
}
render();loadCfg();loadMy();setInterval(function(){if(tab==='pro'&&authed&&sub==='pedidos')loadPro();else if(tab==='meus'&&myPhone)loadMy()},20000);
</script>
</body>
